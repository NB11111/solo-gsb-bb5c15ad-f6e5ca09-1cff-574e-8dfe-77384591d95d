services:
  api:
    build: .
    image: carpool-fare-splitter:latest
    ports:
      - "8000:8000"   # host:container — change the left side to expose another port
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
